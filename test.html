<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        }

        .sky {
        position: relative;
        width: 100%;
        height: 100vh;
        background: linear-gradient(to top, #ff7e5f, #feb47b);
        overflow: hidden;
        }

        .sun {
        position: absolute;
        bottom: 20%;
        left: 50%;
        width: 100px;
        height: 100px;
        margin-left: -50px;
        background: radial-gradient(circle, #FFD700, #FFA500);
        border-radius: 50%;
        box-shadow: 0 0 40px 10px rgba(255,215,0,0.6);
        }

        .ocean {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 30%;
        background: linear-gradient(to top, #1e3c72, #2a5298);
        }

        .cloud {
        position: absolute;
        width: 120px;
        height: 60px;
        background: #fff;
        border-radius: 50px;
        opacity: 0.8;
        top: 20%;
        animation: drift 30s linear infinite;
        }

        .cloud1 { left: -150px; top: 25%; animation-delay: 0s; }
        .cloud2 { left: -250px; top: 35%; animation-delay: 10s; }

        @keyframes drift {
        0% { left: -150px; }
        100% { left: 100%; }
        }
  
    </style>
    <title>Document</title>
</head>
<body>
    <div class="sky">
        <div class="sun"></div>
        <div class="cloud cloud1"></div>
        <div class="cloud cloud2"></div>
        <div class="ocean"></div>
      </div>
      
</body>
</html>
