<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #e6e9ec;
            font-family: sans-serif;
            }

            .scene {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(to top, #d0d5db, #f5f7fa);
            }

            /* Sky clouds */
            .cloud {
            position: absolute;
            background: #fff;
            width: 100px;
            height: 50px;
            border-radius: 50px;
            opacity: 0.8;
            animation: cloudMove 60s linear infinite;
            }

            .cloud1 { top: 20%; left: -150px; animation-delay: 0s; }
            .cloud2 { top: 30%; left: -200px; animation-delay: 20s; }

            @keyframes cloudMove {
            0% { left: -200px; }
            100% { left: 110%; }
            }

            /* Crane */
            .crane {
            position: absolute;
            bottom: 30%;
            left: 50%;
            width: 10px;
            height: 150px;
            background: #4b4e50;
            }

            .crane-arm {
            position: absolute;
            top: 0;
            left: -50px;
            width: 100px;
            height: 8px;
            background: #ff7f00;
            }

            .crane-rope {
            position: absolute;
            top: 8px;
            left: 45px;
            width: 2px;
            height: 50px;
            background: #4b4e50;
            animation: ropeSwing 4s ease-in-out infinite alternate;
            }

            @keyframes ropeSwing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(5deg); }
            }

            /* Buildings */
            .buildings {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 30%;
            display: flex;
            justify-content: center;
            gap: 20px;
            }

            .building {
            background: #4b4e50;
            width: 60px;
            border-radius: 3px;
            }

            .b1 { height: 60%; background: #5c6062; }
            .b2 { height: 90%; background: #4b4e50; }
            .b3 { height: 75%; background: #6d7072; }

    </style>
    <title>Document</title>
</head>
<body>
    <div class="scene">
        <div class="sky">
          <div class="cloud cloud1"></div>
          <div class="cloud cloud2"></div>
        </div>
        <div class="crane">
          <div class="crane-arm"></div>
          <div class="crane-rope"></div>
        </div>
        <div class="buildings">
          <div class="building b1"></div>
          <div class="building b2"></div>
          <div class="building b3"></div>
        </div>
      </div>      
</body>
</html>
