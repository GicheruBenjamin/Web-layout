<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: linear-gradient(to bottom, #60a5fa, #a7f3d0);
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.landscape {
  position: relative;
  width: clamp(300px, 80vw, 800px);
  height: 300px;
  overflow: hidden;
}

/* SKY & SUN */
.sky {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
}

.sun {
  position: absolute;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 60px;
  background: radial-gradient(circle, #fcd34d, #fbbf24);
  border-radius: 50%;
  box-shadow: 0 0 30px rgba(252,211,77,0.6);
}

/* CLOUDS */
.cloud {
  position: absolute;
  top: 40px;
  width: 80px;
  height: 40px;
  background: white;
  border-radius: 20px;
  filter: blur(2px);
  animation: moveCloud 30s linear infinite;
}

.cloud1 { left: -100px; animation-delay: 0s; }
.cloud2 { top: 70px; left: -150px; animation-delay: 10s; }

@keyframes moveCloud {
  0% { transform: translateX(0); }
  100% { transform: translateX(100vw); }
}

/* MOUNTAINS */
.mountains {
  position: absolute;
  bottom: 60px;
  width: 100%;
  height: 120px;
}

.mountain {
  position: absolute;
  bottom: 0;
  width: 0;
  height: 0;
  border-left: 80px solid transparent;
  border-right: 80px solid transparent;
  border-bottom: 120px solid #374151;
}

.left { left: 50px; }
.right { right: 50px; border-bottom-color: #4b5563; }

/* TREES */
.trees {
  position: absolute;
  bottom: 40px;
  width: 100%;
  display: flex;
  justify-content: space-around;
}

.tree {
  position: relative;
  width: 0;
  height: 0;
  border-left: 15px solid transparent;
  border-right: 15px solid transparent;
  border-bottom: 40px solid #065f46;
}

.tree::before {
  content: '';
  position: absolute;
  bottom: -10px;
  left: -3px;
  width: 6px;
  height: 10px;
  background: #654321;
  border-radius: 1px;
}

.small {
  border-left-width: 10px;
  border-right-width: 10px;
  border-bottom-width: 25px;
}

/* GROUND */
.ground {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 40px;
  background: linear-gradient(to top, #065f46, #10b981);
  border-top-left-radius: 50% 20px;
  border-top-right-radius: 50% 20px;
}
  
    </style>
    <title>Document</title>
</head>
<body>
    <div class="landscape">
        <div class="sky">
          <div class="sun"></div>
          <div class="cloud cloud1"></div>
          <div class="cloud cloud2"></div>
        </div>
        <div class="mountains">
          <div class="mountain left"></div>
          <div class="mountain right"></div>
        </div>
        <div class="trees">
          <div class="tree"></div>
          <div class="tree small"></div>
          <div class="tree"></div>
        </div>
        <div class="ground"></div>
      </div>
       
</body>
</html>
